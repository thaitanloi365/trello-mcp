<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trello MCP</title>
<style>
/* claude-usage's Swiss sheet: one grotesque, ink on paper, rules not boxes; Swiss red only for the action the page asks for and for alarms. */
:root { color-scheme: light dark; --paper:#fff; --ink:#111; --muted:#5c5c5c; --hair:#d4d4d4; --red:#da291c; --red-ink:#da291c; --on-red:#fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) { color-scheme: dark; --paper:#0d0d0d; --ink:#f2f2f2; --muted:#a3a3a3; --hair:#333; --red-ink:#ff6a5c; } }
:root[data-theme=dark] { color-scheme: dark; --paper:#0d0d0d; --ink:#f2f2f2; --muted:#a3a3a3; --hair:#333; --red-ink:#ff6a5c; }
:root[data-theme=light] { color-scheme: light; }
* { box-sizing: border-box; }
html { scrollbar-color: var(--ink) var(--paper); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; }
main { max-width: 1240px; margin: 0 auto; padding: 32px 24px 64px; }
::selection { background: var(--red); color: var(--on-red); }
:focus-visible { outline: 2px solid var(--red-ink); outline-offset: 2px; }
h1 { margin: 0; font-weight: 700; letter-spacing: -.02em; }
a { color: inherit; }
.mark { display: inline-flex; gap: 4.5px; align-items: flex-start; }
.mark i { width: 9px; background: currentColor; }

/* Masthead: name flush left, state and tools flush right, closed by a heavy rule. */
.mast { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; padding-bottom: 16px; border-bottom: 4px solid var(--ink); }
h1 { display: flex; align-items: center; gap: 14px; font-size: 40px; line-height: 1; }
.tools { margin-left: auto; display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; }
.meta { color: var(--muted); font-size: 13px; }

/* Buttons: square, ink outline; red only for the page's one action. */
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 32px; padding: 4px 12px; font: inherit; font-size: 13px; font-weight: 700; color: var(--ink); background: transparent; border: 2px solid var(--ink); border-radius: 0; cursor: pointer; white-space: nowrap; text-decoration: none; }
@media (hover: hover) { .btn:hover:not(:disabled) { background: var(--ink); color: var(--paper); } }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--on-red); }
@media (hover: hover) { .btn.primary:hover:not(:disabled) { background: var(--ink); border-color: var(--ink); color: var(--paper); } }
.btn.sm { min-height: 26px; padding: 1px 8px; font-size: 12px; border-width: 1.5px; }
.btn.done { background: var(--ink); color: var(--paper); }
.btn:disabled { opacity: .4; cursor: default; }
@media (pointer: coarse) { .btn { min-height: 44px; } .btn.sm { min-height: 36px; } }
.seg { display: flex; }
.seg button { font: inherit; font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 4px 8px 3px; border: 1px solid var(--ink); margin-left: -1px; border-radius: 0; background: transparent; color: var(--ink); cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--ink); color: var(--paper); }
.label { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.search { margin-top: 28px; }
.box { display: flex; margin-top: 6px; }
.box input { flex: 1; min-width: 0; height: 48px; padding: 0 14px; font: inherit; font-size: 17px; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-right: 0; border-radius: 0; }
.box .btn { min-height: 48px; padding: 0 18px; }

.err { margin-top: 12px; padding: 10px 14px; border: 2px solid var(--red-ink); color: var(--red-ink); font-weight: 700; overflow-wrap: anywhere; }
.empty { margin: 0; padding: 16px 0; color: var(--muted); border-bottom: 1px solid var(--hair); }
.small { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.no { color: var(--muted); font-weight: 400; }

/* Waiting on you: card, the mention, the actions. */
.wait { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.5fr) auto; gap: 8px 24px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--ink); }
.wait .t { font-size: 17px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.wait .t a { text-decoration: none; }
@media (hover: hover) { .wait .t a:hover { text-decoration: underline; } }
.quote { margin: 0; font-size: 14px; border-left: 3px solid var(--ink); padding-left: 10px; overflow-wrap: anywhere; }
.quote .small { display: block; margin-top: 2px; }
.acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.acts .pick { width: 20px; height: 20px; margin: 0; align-self: center; accent-color: var(--red); cursor: pointer; }
@media (pointer: coarse) { .acts .pick { width: 28px; height: 28px; } }

/* Loading: bars in the shape of the rows to come. */
.sk { display: block; margin: 3px 0; max-width: 100%; background: var(--hair); animation: pulse 1.5s ease-in-out infinite; }
.no .sk, .r .sk { margin-left: auto; }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Tabs: Waiting on you | Ready for dev | In progress | Servers, over one heavy rule; a bar marks the open one. */
.tabs { display: flex; flex-wrap: wrap; gap: 0 28px; margin-top: 44px; border-bottom: 4px solid var(--ink); }
.tab { display: flex; align-items: baseline; gap: 10px; padding: 10px 0; font: inherit; font-size: 22px; font-weight: 700; letter-spacing: -.02em; color: var(--muted); background: transparent; border: 0; border-radius: 0; cursor: pointer; }
.tab[aria-selected=true] { color: var(--ink); box-shadow: inset 0 4px 0 var(--ink); }
@media (hover: hover) { .tab:hover { color: var(--ink); } }
.tab .n.red { color: var(--red-ink); }
.note { margin: 12px 0 0; color: var(--muted); font-size: 13px; }

/* The project, and where Send to Orca goes. */
.bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; margin-top: 16px; }
.bar .field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 280px; min-width: 0; }
.bar .field.narrow { flex: 0 0 140px; }
/* Searchable select, after shadcn's Combobox: an ink trigger opens a search box over the list. */
.combo { position: relative; }
.combo-btn { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 2px 8px; font: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 0; text-align: left; cursor: pointer; }
.combo-btn .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.combo-btn .t.ph { color: var(--muted); }
.combo-btn:disabled { opacity: .4; cursor: default; }
.combo-pop { position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; right: 0; background: var(--paper); border: 2px solid var(--ink); }
.combo-pop input { display: block; width: 100%; height: 36px; padding: 0 10px; font: inherit; font-size: 14px; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; outline: 0; }
.combo-list { max-height: 280px; overflow-y: auto; padding: 4px 0; }
.combo-opt { display: flex; gap: 8px; align-items: center; padding: 6px 10px; font-size: 14px; overflow-wrap: anywhere; cursor: pointer; }
.combo-opt::before { content: ''; width: 12px; flex: none; font-weight: 700; }
.combo-opt[aria-selected=true]::before { content: '✓'; }
.combo-opt.on { background: var(--ink); color: var(--paper); }
.combo-empty { margin: 0; padding: 10px; color: var(--muted); font-size: 13px; text-align: center; }
@media (pointer: coarse) { .combo-btn { min-height: 44px; } .combo-opt { min-height: 44px; } .combo-pop input { height: 44px; font-size: 16px; } }
.status { margin-top: 10px; font-size: 13px; overflow-wrap: anywhere; }

/* Ready for dev | In progress. */
.board { margin-top: 14px; display: flex; gap: 8px; align-items: baseline; padding-bottom: 4px; border-bottom: 1px solid var(--ink); font-size: 13px; font-weight: 700; }
.board a { text-decoration: none; }
.board span { color: var(--muted); font-weight: 400; }
.tk { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--hair); font-size: 14px; }
.tk .no { text-align: right; font-size: 13px; }
.tk .tt { min-width: 0; }
.tk .tt a { display: block; font-weight: 700; text-decoration: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
@media (hover: hover) { .tk .tt a:hover { text-decoration: underline; } }
.tk .small { display: block; }

/* Servers: big figures, then the folding table. */
.figs { display: flex; flex-wrap: wrap; gap: 16px 40px; margin: 16px 0 14px; }
.figs b { display: block; font-size: 34px; line-height: 1; letter-spacing: -.02em; margin-top: 4px; }
.sg { display: grid; grid-template-columns: 56px minmax(0, 1fr) 64px 76px 60px 70px 92px; gap: 10px; align-items: center; font-size: 14px; }
.sg .r { text-align: right; }
.sg.th { padding-bottom: 6px; border-bottom: 1px solid var(--ink); }
button.sg { width: 100%; min-height: 40px; padding: 0; font: inherit; font-size: 14px; color: inherit; background: transparent; border: 0; border-bottom: 1px solid var(--hair); border-radius: 0; text-align: left; cursor: pointer; }
@media (hover: hover) { button.sg:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); } }
.sg .lab { grid-column: 1 / 4; display: flex; gap: 8px; align-items: center; min-width: 0; font-weight: 700; }
.sg .lab .t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.sg .lab .n { color: var(--muted); font-weight: 400; font-size: 13px; white-space: nowrap; }
.chev { width: 12px; flex: none; font-size: 10px; color: var(--muted); }
.sg.srv { min-height: 38px; border-bottom: 1px solid var(--hair); }
.sg .b { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bold { font-weight: 700; }

@media (max-width: 860px) {
  main { padding: 20px 16px 48px; }
  h1 { font-size: 30px; }
  .wait { grid-template-columns: 1fr; }
  .acts { justify-content: flex-start; }
  .sg { grid-template-columns: 48px minmax(0, 1fr) 56px 50px 84px; }
  .sg .up, .sg .cpu { display: none; }
  .sg .lab { grid-column: 1 / 3; flex-wrap: wrap; row-gap: 0; }
  /* The count would leave the name no room: it goes under the name. */
  .sg .lab .t { flex: 1 1 0; }
  .sg .lab .n { flex-basis: 100%; padding-left: 20px; }
  .figs b { font-size: 26px; }
}
/* Phones: the four tabs in two rows of two, so a count coming or going never reflows the row. */
@media (max-width: 560px) {
  .tabs { display: grid; grid-template-columns: 1fr 1fr; }
  .tab { font-size: 18px; }
}
</style>
</head>
<body>
<main>
  <header class="mast">
    <h1><span class="mark" aria-hidden="true"><i style="height:36px"></i><i style="height:23px"></i><i style="height:29px"></i></span>Trello MCP</h1>
    <div class="tools">
      <span class="meta" id="meta"></span>
      <button class="btn" id="refresh" type="button">Refresh</button>
      <div class="seg" id="theme" role="group" aria-label="Theme">
        <button type="button" data-t="auto">AUTO</button><button type="button" data-t="light">LIGHT</button><button type="button" data-t="dark">DARK</button>
      </div>
    </div>
  </header>

  <section class="search">
    <label class="label" for="q">Search cards: words, a card URL, or a card number in the picked project</label>
    <form class="box" id="search"><input id="q" type="search" autocomplete="off" placeholder="Search cards"><button class="btn" type="submit">Search</button></form>
    <div id="results" aria-live="polite"></div>
  </section>

  <div class="tabs" id="tabs" role="tablist" aria-label="Cards">
    <button class="tab" type="button" role="tab" id="tab-waiting" aria-controls="waiting-panel" data-tab="waiting">Waiting on you <span class="n" id="waiting-n"></span></button>
    <button class="tab" type="button" role="tab" id="tab-ready" aria-controls="lists-panel" data-tab="ready">Ready for dev <span class="n" id="ready-n"></span></button>
    <button class="tab" type="button" role="tab" id="tab-progress" aria-controls="lists-panel" data-tab="progress">In progress <span class="n" id="progress-n"></span></button>
    <button class="tab" type="button" role="tab" id="tab-servers" aria-controls="servers-panel" data-tab="servers">Servers <span class="n" id="servers-n"></span></button>
  </div>

  <section id="waiting-panel" role="tabpanel" aria-labelledby="tab-waiting">
    <p class="note">@mentions from the last 30 days, on cards in Ready for dev, In progress or Testing, that you haven't commented after.</p>
    <div id="waiting"></div>
  </section>

  <section id="lists-panel" role="tabpanel" hidden>
    <div class="bar">
      <div class="field"><span class="label" id="board-label">Project</span><select id="board" hidden disabled><option value="">Pick a project</option></select></div>
      <div class="field"><span class="label" id="repo-label">Repo for Send to Orca</span><select id="repo" hidden disabled><option value="">Pick a repo</option></select></div>
      <div class="field narrow"><span class="label" id="agent-label">Agent</span><select id="agent" hidden><option value="claude">Claude</option><option value="codex">Codex</option><option value="agy">agy</option></select></div>
      <button class="btn" id="copy-picked" type="button" disabled>Copy links</button>
      <button class="btn primary" id="send-picked" type="button" disabled>Send selected</button>
    </div>
    <div class="status" id="orca-status" aria-live="polite"></div>
    <div id="ready"></div>
    <div id="progress" hidden></div>
  </section>

  <section id="servers-panel" role="tabpanel" aria-labelledby="tab-servers" hidden>
    <p class="note">Live, every 2 s.</p>
    <div id="servers"></div>
  </section>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
/** An element with a class and text: Trello text is only ever set as text. */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
// Links only ever point at Trello.
const trelloURL = u => /^https:\/\/trello\.com\//.test(u || '') ? u : null;
function link(cls, text, url) {
  const a = el('a', cls, text);
  const u = trelloURL(url);
  if (u) { a.href = u; a.target = '_blank'; a.rel = 'noopener'; }
  return a;
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
function errorBox(text) { const e = el('div', 'err', text); e.setAttribute('role', 'alert'); return e; }
const join = (...parts) => parts.filter(Boolean).join(' · ');
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const times = (n, f) => Array.from({ length: n }, () => f());

// Loading skeletons: grey bars laid out by the same row classes as the data they stand in for.
function bone(w, h) {
  const b = el('span', 'sk');
  b.style.width = w;
  b.style.height = h + 'px';
  return b;
}
function skeleton(...rows) {
  const box = el('div');
  box.setAttribute('role', 'status');
  box.append(el('span', 'sr', 'Loading…'), ...rows);
  return box;
}
function waitBones() {
  const row = el('div', 'wait'), card = el('div'), quote = el('div', 'quote'), acts = el('div', 'acts');
  card.append(bone('75%', 17), bone('40%', 12));
  quote.append(bone('90%', 14), bone('55%', 12));
  acts.append(bone('132px', 26), bone('52px', 26));
  row.append(card, quote, acts);
  return row;
}
function cardBones() {
  const row = el('div', 'tk'), no = el('span', 'no'), tt = el('span', 'tt'), acts = el('span', 'acts');
  no.append(bone('28px', 13));
  tt.append(bone('60%', 15), bone('35%', 11));
  acts.append(bone('104px', 26), bone('48px', 26));
  row.append(no, tt, acts);
  return row;
}
function listsBones() {
  const head = el('div', 'board');
  head.append(bone('180px', 13));
  return skeleton(head, ...times(6, cardBones));
}
function serversBones() {
  const figs = el('div', 'figs');
  figs.append(...times(4, () => { const f = el('div'); f.append(bone('56px', 11), bone('72px', 34)); return f; }));
  return skeleton(figs, ...times(4, () => {
    const row = el('div', 'sg srv'), lab = el('span', 'lab');
    lab.append(bone('45%', 14));
    row.append(lab, ...[['r', 28], ['r cpu', 36], ['r', 48]].map(([cls, w]) => { const c = el('span', cls); c.append(bone(w + 'px', 13)); return c; }), el('span'));
    return row;
  }));
}

// Theme: AUTO follows the system; the choice stays in this browser.
function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else { delete document.documentElement.dataset.theme; t = 'auto'; }
  for (const b of $('theme').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.t === t));
}
$('theme').addEventListener('click', e => {
  const t = e.target.closest('button')?.dataset.t;
  if (t) { store.set('theme', t); applyTheme(t); }
});
applyTheme(store.get('theme'));

async function getJSON(url) {
  const r = await fetch(url, { cache: 'no-store', headers: { 'X-Trello-MCP': '1' } });
  if (!r.ok) throw new Error((await r.text()).trim() || `HTTP ${r.status}`);
  return r.json();
}

async function copy(btn, text) {
  const was = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied'; }
  catch { btn.textContent = 'Copy failed'; }
  btn.classList.add('done');
  setTimeout(() => { btn.textContent = was; btn.classList.remove('done'); }, 1200);
}
function copyBtn(label, text, primary) {
  const b = el('button', 'btn sm' + (primary ? ' primary' : ''), label);
  b.type = 'button';
  b.addEventListener('click', () => copy(b, text));
  return b;
}

// Cards.
const members = c => c.members.length ? c.members.join(', ') : 'no members';
const activity = c => c.activity ? 'active ' + c.activity : '';
const number = c => c.number != null ? '#' + c.number : '';
function cardRow(c, detail, actions) {
  const row = el('div', 'tk');
  const tt = el('span', 'tt');
  tt.append(link('', c.name, c.url), el('span', 'small', detail));
  const acts = el('span', 'acts');
  acts.append(...actions);
  row.append(el('span', 'no', number(c)), tt, acts);
  return row;
}

function renderWaiting(w) {
  const rows = w.rows || [];
  $('waiting-n').textContent = rows.length || '';
  $('waiting-n').classList.toggle('red', rows.length > 0);
  const out = w.error ? [errorBox(w.error)] : [];
  if (!rows.length && !w.error) out.push(el('p', 'empty', 'Nothing waiting on you.'));
  for (const c of rows) {
    const row = el('div', 'wait');
    const card = el('div');
    const t = el('div', 't');
    t.append(el('span', 'no', number(c) + ' '), link('', c.name, c.url));
    card.append(t, el('div', 'small', join(c.board, c.list)));
    const quote = el('blockquote', 'quote', c.mention);
    quote.append(el('span', 'small', join(c.by, c.age, c.earlier ? `+${plural(c.earlier, 'earlier mention')}` : '')));
    const acts = el('div', 'acts');
    acts.append(copyBtn('Copy comment link', c.commentUrl, true), link('btn sm', 'Open', c.url));
    row.append(card, quote, acts);
    out.push(row);
  }
  $('waiting').replaceChildren(...out);
}

// Tabs: the choice stays in this browser. Ready for dev and In progress share the project bar.
const TABS = ['waiting', 'ready', 'progress', 'servers'];
function showTab(t) {
  if (!TABS.includes(t)) t = 'waiting';
  for (const b of $('tabs').querySelectorAll('[role=tab]')) {
    const on = b.dataset.tab === t;
    b.setAttribute('aria-selected', String(on));
    b.tabIndex = on ? 0 : -1;
  }
  const lists = t === 'ready' || t === 'progress';
  $('waiting-panel').hidden = t !== 'waiting';
  $('servers-panel').hidden = t !== 'servers';
  $('lists-panel').hidden = !lists;
  if (lists) $('lists-panel').setAttribute('aria-labelledby', 'tab-' + t);
  $('ready').hidden = t !== 'ready';
  $('progress').hidden = t !== 'progress';
  store.set('tab', t);
}
$('tabs').addEventListener('click', e => { const t = e.target.closest('[role=tab]')?.dataset.tab; if (t) showTab(t); });
$('tabs').addEventListener('keydown', e => {
  const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (!step) return;
  const at = TABS.indexOf(store.get('tab') || 'waiting');
  const t = TABS[(at + step + TABS.length) % TABS.length];
  showTab(t);
  $('tab-' + t).focus();
});
showTab(store.get('tab'));

/**
 * A searchable select, after shadcn's Combobox. The hidden <select> keeps the options and the
 * value and fires change on a pick; call sync() after changing either from code.
 */
function combo(sel, noun) {
  const wrap = el('div', 'combo'), btn = el('button', 'combo-btn'), text = el('span', 't');
  btn.type = 'button';
  btn.id = sel.id + '-btn';
  btn.setAttribute('role', 'combobox');
  btn.setAttribute('aria-haspopup', 'listbox');
  btn.setAttribute('aria-expanded', 'false');
  btn.setAttribute('aria-labelledby', `${sel.id}-label ${btn.id}`);
  btn.append(text, el('span', 'chev', '▼'));
  const pop = el('div', 'combo-pop'), input = el('input'), list = el('div', 'combo-list');
  pop.hidden = true;
  input.type = 'text';
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.placeholder = `Search ${noun}s…`;
  list.id = sel.id + '-list';
  list.setAttribute('role', 'listbox');
  for (const [k, v] of [['role', 'combobox'], ['aria-expanded', 'true'], ['aria-autocomplete', 'list'], ['aria-controls', list.id], ['aria-label', `Search ${noun}s`]]) input.setAttribute(k, v);
  pop.append(input, list);
  wrap.append(btn, pop);
  sel.after(wrap);

  let items = [], active = -1;
  function sync() {
    const o = sel.selectedOptions[0];
    text.textContent = o ? o.textContent : '';
    text.classList.toggle('ph', !sel.value);
    btn.title = o?.title || '';
    btn.disabled = sel.disabled;
    if (sel.disabled) close();
    else if (!pop.hidden) filter();
  }
  function setActive(i) {
    items[active]?.classList.remove('on');
    active = i;
    const it = items[i];
    if (!it) { input.removeAttribute('aria-activedescendant'); return; }
    it.classList.add('on');
    input.setAttribute('aria-activedescendant', it.id);
    it.scrollIntoView({ block: 'nearest' });
  }
  // Every typed word must appear in the option, in any order; the first match is active.
  function filter() {
    const words = input.value.toLowerCase().split(/\s+/).filter(Boolean);
    items = [...sel.options].filter(o => o.value && words.every(w => o.textContent.toLowerCase().includes(w))).map(o => {
      const it = el('div', 'combo-opt', o.textContent);
      it.id = `${sel.id}-opt-${o.index}`;
      it.dataset.i = o.index;
      it.title = o.title;
      it.setAttribute('role', 'option');
      it.setAttribute('aria-selected', String(o.value === sel.value));
      return it;
    });
    active = -1;
    list.replaceChildren(...(items.length ? items : [el('p', 'combo-empty', `No ${noun} found.`)]));
    setActive(words.length ? 0 : Math.max(0, items.findIndex(it => it.getAttribute('aria-selected') === 'true')));
  }
  function open() {
    if (btn.disabled) return;
    pop.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    input.value = '';
    filter();
    input.focus();
  }
  function close(refocus) {
    if (pop.hidden) return;
    pop.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
    if (refocus) btn.focus();
  }
  function pick(it) {
    const o = sel.options[it.dataset.i];
    close(true);
    if (o.value === sel.value) return;
    sel.value = o.value;
    sync();
    sel.dispatchEvent(new Event('change'));
  }

  // The search box keeps the focus while the popover is open; leaving the combo closes it.
  btn.addEventListener('mousedown', e => e.preventDefault());
  list.addEventListener('mousedown', e => e.preventDefault());
  btn.addEventListener('click', () => pop.hidden ? open() : close(true));
  btn.addEventListener('keydown', e => { if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); open(); } });
  input.addEventListener('input', filter);
  input.addEventListener('keydown', e => {
    const step = { ArrowDown: 1, ArrowUp: -1 }[e.key];
    if (step) { e.preventDefault(); if (items.length) setActive(Math.min(items.length - 1, Math.max(0, active + step))); }
    else if (e.key === 'Enter') { e.preventDefault(); if (items[active]) pick(items[active]); }
    else if (e.key === 'Escape') { e.preventDefault(); close(true); }
  });
  list.addEventListener('pointermove', e => { const it = e.target.closest('[role=option]'); if (it && it !== items[active]) setActive(items.indexOf(it)); });
  list.addEventListener('click', e => { const it = e.target.closest('[role=option]'); if (it) pick(it); });
  wrap.addEventListener('focusout', e => { if (!pop.contains(e.relatedTarget)) close(); });
  sync();
  return { sync, btn };
}

// Send to Orca: the repo is remembered per project, the agent once.
const boardBox = combo($('board'), 'project'), repoBox = combo($('repo'), 'repo'), agentBox = combo($('agent'), 'agent');
const board = () => $('board').value;
function orcaStatus(text, failed) { $('orca-status').replaceChildren(failed ? errorBox(text) : el('span', '', text)); }
async function postJSON(url) {
  const r = await fetch(url, { method: 'POST', headers: { 'X-Trello-MCP': '1' } });
  if (!r.ok) throw new Error((await r.text()).trim() || `HTTP ${r.status}`);
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d;
}
// A card already in Orca (`s`, its session) shows In Orca: a send only marks it unread there.
function sendBtn(c, s) {
  const label = s ? 'In Orca' : 'Send to Orca';
  const b = el('button', s ? 'btn sm' : 'btn sm primary', label);
  b.type = 'button';
  if (s) b.title = `${s.name}: mark it unread in Orca`;
  b.addEventListener('click', async () => {
    const repo = $('repo').value, agent = $('agent').value;
    if (!repo && !s) { orcaStatus('Pick the repo for this project first.', true); repoBox.btn.focus(); return; }
    b.disabled = true;
    b.textContent = 'Sending…';
    try {
      const d = await postJSON('/api/orca/send?' + new URLSearchParams({ card: c.url, repo, agent }));
      b.textContent = d.existing ? 'In Orca' : 'Sent';
      orcaStatus(d.existing
        ? `${number(c)} already has ${d.name} in ${d.repo}: marked unread in Orca.`
        : `${agent} is on ${number(c)} in ${d.name}, from ${d.base}.`);
    } catch (e) {
      b.textContent = label;
      b.disabled = false;
      orcaStatus(`${number(c)}: ${e.message}`, true);
    }
  });
  return b;
}

// Copy links and Send selected: the picked cards' links. Send selected skips the cards in Orca.
const picked = new Set(), inOrcaCards = new Set();
const toSend = () => [...picked].filter(u => !inOrcaCards.has(u));
function syncPicked() {
  const n = toSend().length, skip = picked.size - n;
  $('copy-picked').disabled = !picked.size;
  $('send-picked').disabled = !n;
  $('send-picked').textContent = n ? `Send selected (${n})` : 'Send selected';
  $('send-picked').title = skip ? `${plural(skip, 'picked card')} already in Orca, not sent` : '';
}
function pickBox(c) {
  const box = el('input', 'pick');
  box.type = 'checkbox';
  box.checked = picked.has(c.url);
  box.setAttribute('aria-label', `Pick ${number(c)}`);
  box.addEventListener('change', () => { if (box.checked) picked.add(c.url); else picked.delete(c.url); syncPicked(); });
  return box;
}
// One link per line, so a paste puts each card on its own line.
$('copy-picked').addEventListener('click', () => copy($('copy-picked'), [...picked].join('\n')));
$('send-picked').addEventListener('click', async () => {
  const b = $('send-picked'), repo = $('repo').value, agent = $('agent').value;
  if (!repo) { orcaStatus('Pick the repo for this project first.', true); repoBox.btn.focus(); return; }
  b.disabled = true;
  b.textContent = 'Sending…';
  try {
    const d = await postJSON('/api/orca/send?' + new URLSearchParams({ cards: toSend().join(','), repo, agent }));
    picked.clear();
    orcaStatus(d.planned
      ? `Claude is grouping ${plural(d.cards, 'card')} in ${d.repo}: it starts one ${agent} session per group in Orca.`
      : `${agent} is on it in ${d.name}, from ${d.base}.`);
    loadBoard(true);
  } catch (e) {
    orcaStatus(e.message, true);
  }
  syncPicked();
});

const inOrca = s => `Orca: ${s.repo}, ${join(s.agent, s.state)}`;
// `sessions`: each card in Orca by its short link, lowercased (Orca may lowercase it); `shown`
// collects every card's link.
function renderLists(id, section, name, sessions, shown) {
  const boards = section.boards || [];
  $(id + '-n').textContent = boards.reduce((n, b) => n + b.cards.length, 0) || '';
  const out = section.error ? [errorBox(section.error)] : [];
  if (!boards.length && !section.error) out.push(el('p', 'empty', `No cards in ${name} lists.`));
  for (const b of boards) {
    const head = el('div', 'board');
    head.append(link('', b.board, b.url), el('span', '', String(b.cards.length)));
    out.push(head);
    for (const c of b.cards) {
      const s = sessions.get(c.url.split('/').pop().toLowerCase());
      shown.add(c.url);
      if (s) inOrcaCards.add(c.url);
      const acts = [pickBox(c), sendBtn(c, s), copyBtn('Copy', c.url)];
      out.push(cardRow(c, join(members(c), activity(c), s && inOrca(s)), acts));
    }
  }
  $(id).replaceChildren(...out);
}

function listsMessage(node) {
  for (const id of ['ready', 'progress']) { $(id).replaceChildren(node.cloneNode(true)); $(id + '-n').textContent = ''; }
}

// One project at a time; only the latest pick's answer shows. A quiet reload keeps the old cards up.
let boardSeq = 0;
async function loadBoard(quiet) {
  const id = board(), seq = ++boardSeq;
  if (!id) { listsMessage(el('p', 'empty', 'Pick a project to see its cards.')); return; }
  if (!quiet) listsMessage(listsBones());
  try {
    // With Orca down the cards still show, without their sessions.
    const [d, o] = await Promise.all([
      getJSON('/api/board?id=' + encodeURIComponent(id)),
      getJSON('/api/orca/sessions').catch(() => ({})),
    ]);
    if (seq !== boardSeq) return;
    if (d.error) throw new Error(d.error);
    const sessions = new Map((o.sessions || []).map(s => [s.card, s]));
    const shown = new Set();
    inOrcaCards.clear();
    renderLists('ready', d.ready, 'Ready for dev', sessions, shown);
    renderLists('progress', d.progress, 'In progress', sessions, shown);
    for (const u of picked) if (!shown.has(u)) picked.delete(u);
    syncPicked();
  } catch (e) {
    if (seq === boardSeq) listsMessage(errorBox(e.message));
  }
}

function fillBoards(boards) {
  const was = board() || store.get('board') || '';
  const sorted = [...boards].sort((a, b) => (a.workspace || '').localeCompare(b.workspace || '') || a.name.localeCompare(b.name));
  const opts = [el('option', '', 'Pick a project')];
  opts[0].value = '';
  for (const b of sorted) {
    const o = el('option', '', b.workspace ? `${b.name} · ${b.workspace}` : b.name);
    o.value = b.id;
    opts.push(o);
  }
  $('board').replaceChildren(...opts);
  $('board').value = boards.some(b => b.id === was) ? was : '';
  $('board').disabled = false;
  boardBox.sync();
}

let repos = null;
function pickRepo() {
  $('repo').disabled = !repos || !board();
  $('repo').value = (board() && store.get('repo:' + board())) || '';
  if ($('repo').selectedIndex < 0) $('repo').value = '';
  repoBox.sync();
}
async function loadRepos() {
  try {
    const d = await getJSON('/api/orca/repos');
    if (d.error) throw new Error(d.error);
    repos = d.repos.sort((a, b) => a.name.localeCompare(b.name));
    const opts = [el('option', '', 'Pick a repo')];
    opts[0].value = '';
    for (const r of repos) { const o = el('option', '', r.name); o.value = r.id; o.title = r.path; opts.push(o); }
    $('repo').replaceChildren(...opts);
  } catch (e) {
    orcaStatus('Orca unavailable: ' + e.message, true);
  }
  pickRepo();
}
$('board').addEventListener('change', () => { store.set('board', board()); $('orca-status').replaceChildren(); picked.clear(); syncPicked(); pickRepo(); loadBoard(); });
$('repo').addEventListener('change', () => { if (board()) store.set('repo:' + board(), $('repo').value); });
$('agent').value = store.get('agent') || 'claude';
if ($('agent').selectedIndex < 0) $('agent').value = 'claude';
agentBox.sync();
$('agent').addEventListener('change', () => store.set('agent', $('agent').value));

// The first load and Refresh show skeletons; the 5-minute reload swaps the data in place.
let loadingTrello = false, lastTrello = 0;
async function loadTrello(fresh) {
  if (loadingTrello) return;
  loadingTrello = true;
  $('refresh').disabled = true;
  const quiet = !fresh && lastTrello > 0;
  if (!quiet) {
    $('waiting').replaceChildren(skeleton(...times(3, waitBones)));
    $('waiting-n').textContent = '';
    listsMessage(listsBones());
  }
  try {
    const d = await getJSON('/api/trello' + (fresh ? '?fresh=1' : ''));
    if (d.error) throw new Error(d.error);
    lastTrello = Date.now();
    $('meta').textContent = `${plural(d.boards.length, 'board')} · updated ${new Date(d.updatedAt * 1000).toLocaleTimeString([], { hour12: false })}`;
    renderWaiting(d.waiting);
    fillBoards(d.boards);
    pickRepo();
    await loadBoard(quiet);
  } catch (e) {
    $('meta').textContent = 'Trello unavailable';
    $('waiting').replaceChildren(errorBox(e.message));
    $('waiting-n').textContent = '';
    listsMessage(errorBox(e.message));
  } finally {
    loadingTrello = false;
    $('refresh').disabled = false;
  }
}
$('refresh').addEventListener('click', () => loadTrello(true));

// Search: 300 ms after typing stops, at once on Enter; only the latest answer shows.
let searchTimer, searchSeq = 0;
async function search() {
  const q = $('q').value.trim();
  const seq = ++searchSeq;
  if (!q) { $('results').replaceChildren(); return; }
  try {
    const d = await getJSON('/api/search?' + new URLSearchParams({ q, board: board() }));
    if (seq !== searchSeq) return;
    if (d.error) throw new Error(d.error);
    $('results').replaceChildren(...(d.cards.length
      ? d.cards.map(c => cardRow(c, join(c.board, c.list, members(c), activity(c)), [copyBtn('Copy link', c.url), link('btn sm', 'Open', c.url)]))
      : [el('p', 'empty', 'No cards found.')]));
  } catch (e) {
    if (seq === searchSeq) $('results').replaceChildren(errorBox(e.message));
  }
}
$('q').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(search, 300); });
$('search').addEventListener('submit', e => { e.preventDefault(); clearTimeout(searchTimer); search(); });

// Servers: folded by default; open groups are remembered in this browser.
let open = new Set();
try { open = new Set(JSON.parse(store.get('open-groups') || '[]')); } catch {}
let last = null, confirming = null, confirmTimer = null, serversError = '';

function serverRow(r) {
  const key = `${r.pid}-${r.start}`;
  const row = el('div', 'sg srv');
  for (const [cls, v] of [['r bold', r.pid], ['b', r.build], ['r up', r.up], ['r', r.active], ['r cpu', r.cpu], ['r bold', r.mem]]) row.append(el('span', cls, String(v)));
  row.children[1].title = r.path;
  const armed = confirming === key && !r.stopping;
  const b = el('button', 'btn sm' + (armed ? ' primary' : ''), r.stopping ? 'Quitting…' : armed ? 'Confirm' : 'Quit');
  b.type = 'button';
  b.dataset.key = 'quit-' + key;
  b.disabled = r.stopping;
  b.setAttribute('aria-label', `${armed ? 'Confirm quit of' : 'Quit'} trello-mcp server ${r.pid}`);
  b.addEventListener('click', () => quit(r, key));
  row.append(b);
  return row;
}

// The first click arms a red Confirm for 3 s; the second stops the server.
async function quit(r, key) {
  if (confirming !== key) {
    confirming = key;
    clearTimeout(confirmTimer);
    confirmTimer = setTimeout(() => { if (confirming === key) { confirming = null; if (last) renderServers(last); } }, 3000);
    if (last) renderServers(last);
    return;
  }
  confirming = null;
  clearTimeout(confirmTimer);
  serversError = '';
  try {
    const res = await fetch(`/api/servers/${r.pid}/${r.start}/stop`, { method: 'POST', headers: { 'X-Trello-MCP': '1' } });
    if (!res.ok && res.status !== 404) serversError = (await res.text()).trim();
  } catch (e) { serversError = e.message; }
  loadServers();
}

function groupHead(g) {
  const isOpen = open.has(g.label);
  const head = el('button', 'sg');
  head.type = 'button';
  head.dataset.key = 'group-' + g.label;
  head.setAttribute('aria-expanded', String(isOpen));
  const lab = el('span', 'lab');
  const count = plural(g.count, 'server') + (g.sessions ? ' · ' + plural(g.sessions, 'session') : '');
  lab.append(el('span', 'chev', isOpen ? '▼' : '▶'), el('span', 't', g.label), el('span', 'n', count));
  head.append(lab, el('span', 'r', g.active), el('span', 'r cpu', g.cpu), el('span', 'r bold', g.mem), el('span'));
  head.addEventListener('click', () => {
    if (open.has(g.label)) open.delete(g.label); else open.add(g.label);
    store.set('open-groups', JSON.stringify([...open]));
    renderServers(last);
  });
  return head;
}

function renderServers(d) {
  const box = $('servers');
  $('servers-n').textContent = d.unsupported ? '' : Number(d.figures.servers) || '';
  if (d.unsupported) { box.replaceChildren(el('p', 'empty', 'The server list is available on macOS only.')); return; }
  const focused = document.activeElement?.dataset?.key;
  const out = serversError ? [errorBox(serversError)] : [];
  const figs = el('div', 'figs');
  for (const [name, v] of [['Servers', d.figures.servers], ['Sessions', d.figures.sessions], ['Memory', d.figures.memory], ['CPU', d.figures.cpu]]) {
    const f = el('div');
    f.append(el('div', 'label', name), el('b', '', v));
    figs.append(f);
  }
  out.push(figs);
  if (!d.groups.length) {
    out.push(el('p', 'empty', 'No servers running. Claude Code and Codex start one trello-mcp per session.'));
  } else {
    const th = el('div', 'sg th label');
    for (const [cls, v] of [['r', 'PID'], ['', 'Build'], ['r up', 'Up'], ['r', 'Active'], ['r cpu', 'CPU'], ['r', 'Mem'], ['', '']]) th.append(el('span', cls, v));
    out.push(th);
    for (const g of d.groups) {
      out.push(groupHead(g));
      if (open.has(g.label)) for (const r of g.rows) out.push(serverRow(r));
    }
  }
  box.replaceChildren(...out);
  // A re-render every 2 s must not take the keyboard focus away.
  if (focused) box.querySelector(`[data-key="${CSS.escape(focused)}"]`)?.focus();
}

async function loadServers() {
  try { last = await getJSON('/api/servers'); renderServers(last); }
  catch (e) { $('servers').replaceChildren(errorBox(e.message)); }
}

$('servers').replaceChildren(serversBones());
loadServers();
loadRepos();
loadTrello(false);
setInterval(() => { if (!document.hidden) loadServers(); }, 2000);
setInterval(() => { if (!document.hidden) loadTrello(false); }, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadServers(); if (Date.now() - lastTrello >= 5 * 60 * 1000) loadTrello(false); } });
</script>
</body>
</html>
